name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # rdkit is required: it provides the classical MMFF94 baseline and the
          # SMILES charge parsing, and tests/test_pipeline_e2e.py checks that its
          # kcal/mol energies reach the scorer in the right unit. Leaving it out
          # skipped that check in CI, which is how the 23x unit bug shipped.
          pip install pytest numpy pandas scipy h5py matplotlib rdkit
      - name: Tests
        run: pytest tests/ -q
      - name: Artefact correctness checks
        # Recomputes every committed decision-CSV gap from the raw energies, every
        # QM gap from conformers.jsonl, and summary.csv from the CSVs; exits 1 on
        # any disagreement. Scope: see the docstring of scripts/check_artefacts.py.
        run: python scripts/check_artefacts.py
      - name: Completeness checks
        # Exits 1 on missing ids, an all-NaN or all-zero energy block, n_ok/n_failed
        # disagreeing with the id count, or finite-energy coverage below 0.95. It was
        # added in the round-2 repair but never wired in, so it only ran when someone
        # remembered - the guard existed and could not fire on a push. It passes on
        # the committed artefacts, so this cannot make CI red on an untouched tree.
        run: python scripts/verify_completeness.py
